name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  deploy:
    name: 🚀 Deploy Frontend to Server
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            DEPLOY_DIR="/opt/editorial-front"

            echo "=== Ensuring deployment directory exists ==="
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown -R $USER:$USER "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "=== Syncing repository from GitHub ==="
            if [ -d .git ]; then
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            else
              git clone -b main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            fi

            echo "=== Rebuilding and restarting frontend container ==="
            docker compose down --remove-orphans || true
            docker compose up -d --build --remove-orphans

            echo "=== Checking container status ==="
            sleep 3
            docker compose ps

            echo "=== Cleaning up dangling images ==="
            docker image prune -f

            echo "=== Frontend deployment finished successfully! ==="
